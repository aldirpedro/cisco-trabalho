<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventário de Equipamentos - Cisco Network</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        #formEquip input, #formEquip button {
            padding: 10px;
            font-size: 1em;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        #formEquip button {
            background: #004080;
            color: white;
            border: none;
            cursor: pointer;
            grid-column: 1 / -1;
            font-weight: 600;
        }
        #formEquip button:hover {
            background: #003366;
        }
        .actions {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .actions button {
            padding: 6px 12px;
            font-size: 0.85em;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .actions .edit {
            background: #ffc107;
            color: #000;
        }
        .actions .delete {
            background: #dc3545;
            color: #fff;
        }
        .actions button:hover {
            opacity: 0.8;
        }
        .status-ativo { color: #28a745; font-weight: 600; }
        .status-parado { color: #dc3545; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html" style="text-decoration: none; color: #667eea; font-size: 20px; font-weight: 600;">← Voltar</a>
            <h1>📦 Inventário de Rede</h1>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="servers.html">Servidores</a></li>
            <li><a href="questions.html">Perguntas</a></li>
            <li><a href="users.html">Usuários</a></li>
            <li><a href="inventory.html" class="active">Inventário</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Sistema de Inventário de Rede</h1>
        <p style="text-align: center; color: #666; margin-bottom: 20px;">Adicione, edite ou remova equipamentos da sua rede. Os dados são salvos automaticamente.</p>

        <div class="form-container">
            <form id="formEquip">
                <div class="form-grid">
                    <input type="text" id="dispositivo" placeholder="Dispositivo (ex: Router Core)" required>
                    <input type="text" id="ip" placeholder="IP (ex: 192.168.1.1)" required>
                    <input type="text" id="modelo" placeholder="Modelo (ex: 2911)" required>
                    <input type="text" id="status" placeholder="Status (Ativo/Parado)" value="Ativo">
                </div>
                <button type="submit">➕ Adicionar / Atualizar</button>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Dispositivo</th>
                    <th>IP</th>
                    <th>Modelo</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela"></tbody>
        </table>
    </div>

    <script>
    const API_URL = 'http://localhost:3001/inventory';
    const STORAGE_KEY = 'inventarioRedeLocal';
    let inventario = [];
    let editId = null;
    let useAPI = true;

    // Tentar carregar de API, fallback para localStorage
    async function carregarTabela() {
        console.log('carregarTabela called, useAPI:', useAPI);
        try {
            if (useAPI) {
                console.log('Trying API...');
                const res = await fetch(API_URL, { signal: AbortSignal.timeout(3000) });
                if (!res.ok) throw new Error('API não respondeu');
                inventario = await res.json();
                console.log('API success, loaded:', inventario.length, 'items');
            } else {
                console.log('Using localStorage...');
                inventario = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                console.log('localStorage loaded:', inventario.length, 'items');
            }
        } catch (err) {
            console.warn('API não disponível, usando localStorage', err);
            useAPI = false;
            inventario = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            console.log('Fallback to localStorage:', inventario.length, 'items');
        }
        
        const tbody = document.getElementById('corpoTabela');
        tbody.innerHTML = '';
        if (inventario.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#999;">Nenhum equipamento cadastrado.</td></tr>';
            return;
        }
        
        inventario.forEach(item => {
            const tr = document.createElement('tr');
            const statusClass = item.status === 'Ativo' ? 'status-ativo' : 'status-parado';
            tr.innerHTML = `
                <td>${item.dispositivo}</td>
                <td><code style="background:#f5f5f5;padding:2px 6px;border-radius:3px;">${item.ip}</code></td>
                <td>${item.modelo}</td>
                <td><span class="${statusClass}">${item.status}</span></td>
                <td class="actions">
                    <button class="edit" onclick="editar(${item.id})">✏️ Editar</button>
                    <button class="delete" onclick="excluir(${item.id})">🗑️ Excluir</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function adicionarOuAtualizar(e) {
        e.preventDefault();
        const disp = document.getElementById('dispositivo').value.trim();
        const ip = document.getElementById('ip').value.trim();
        const mod = document.getElementById('modelo').value.trim();
        const stat = document.getElementById('status').value.trim();

        console.log('adicionarOuAtualizar called with:', { disp, ip, mod, stat, editId, useAPI });

        if (!disp || !ip || !mod) {
            alert('Por favor, preencha todos os campos obrigatórios.');
            return;
        }

        const payload = { dispositivo: disp, ip, modelo: mod, status: stat };
        
        try {
            if (useAPI) {
                console.log('Trying API for', editId ? 'update' : 'create');
                if (editId) {
                    const res = await fetch(`${API_URL}/${editId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: AbortSignal.timeout(3000)
                    });
                    if (!res.ok) throw new Error('Erro ao atualizar');
                    console.log('API update success');
                } else {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: AbortSignal.timeout(3000)
                    });
                    if (!res.ok) throw new Error('Erro ao adicionar');
                    console.log('API create success');
                }
            }
        } catch (err) {
            console.warn('API falhou, usando localStorage', err);
            useAPI = false;
            if (editId) {
                const idx = inventario.findIndex(i => i.id === editId);
                if (idx !== -1) inventario[idx] = { ...inventario[idx], ...payload };
                console.log('Updated item in localStorage at index', idx);
            } else {
                payload.id = Date.now();
                inventario.push(payload);
                console.log('Added new item to localStorage with id', payload.id);
            }
            localStorage.setItem(STORAGE_KEY, JSON.stringify(inventario));
            console.log('Saved to localStorage, total items:', inventario.length);
        }

        editId = null;
        document.getElementById('formEquip').reset();
        console.log('Form reset, calling carregarTabela');
        carregarTabela();
    }

    function editar(id) {
        const item = inventario.find(i => i.id === id);
        if (!item) return;
        document.getElementById('dispositivo').value = item.dispositivo;
        document.getElementById('ip').value = item.ip;
        document.getElementById('modelo').value = item.modelo;
        document.getElementById('status').value = item.status;
        editId = id;
        document.getElementById('dispositivo').focus();
    }

    async function excluir(id) {
        if (!confirm('Deseja realmente excluir este equipamento?')) return;
        try {
            if (useAPI) {
                const res = await fetch(`${API_URL}/${id}`, { 
                    method: 'DELETE',
                    signal: AbortSignal.timeout(3000)
                });
                if (!res.ok) throw new Error('Erro ao excluir');
            }
        } catch (err) {
            console.warn('API falhou ao excluir, usando localStorage', err);
            useAPI = false;
            inventario = inventario.filter(i => i.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(inventario));
        }
        carregarTabela();
    }

    document.getElementById('formEquip').addEventListener('submit', adicionarOuAtualizar);
    window.addEventListener('load', carregarTabela);
    </script>
</body>
</html>
